<header>
    <h1>Kursy</h1>
</header>
<main>
    <section>
        <ul>
            <li *ngFor="let course of courseSummaryDto">
                <div class="course-wrapper" [ngClass]="{'long-title': course.displayName.length > 30}">
                    <button mat-raised-button class="course-button" (click)="nextTemplete(course.id)">
                        <div class="course-content">
                            <img [src]="course.imageUrl  || 'assets/default-course-banner.png'" alt="Ilustracja kursu">
                            <div class="course-content-details">
                                <h3>{{course.displayName}}</h3>
                                <p>
                                    {{course.countOfSubjectsInCourse}} tematów
                                </p>
                                <div class="status-div"
                                    [ngClass]="course.accessToModifyCourse ? 'private-div' : 'public-div' ">
                                    <p>{{course.accessToModifyCourse ? 'Prywatny' : 'Publiczny'}}</p>
                                </div>
                            </div>
                        </div>

                    </button>
                    <button *ngIf="course.accessToModifyCourse" mat-icon-button [matMenuTriggerFor]="menu"
                        class="more-horiz" (click)="$event.stopPropagation()">
                        <mat-icon>more_horiz</mat-icon>
                    </button>
                </div>
                <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="goToEditCourseForm(course.id)">
                        <mat-icon>edit</mat-icon>

                    </button>
                    <button mat-menu-item (click)="openDeleteDialog(course.id)">
                        <mat-icon>delete</mat-icon>
                        Usuń
                    </button>

                Dodaj kurs
