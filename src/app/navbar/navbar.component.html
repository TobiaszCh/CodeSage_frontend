<header class="navbar">
    <a class="logo" routerLink="/courses">
        <img src="assets/logo-app.png" alt="Podgląd logo kursu">
        <h1>Code Sage</h1>
    </a>
    <nav class="navigation">
        <button mat-button disabled="true" aria-label="Menu użytkownika" class="user-button">
            <mat-icon class="user-icon">account_circle</mat-icon>
            <span>{{ username }}</span>
        </button>
        <button class="user-logout" mat-button (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Wyloguj</span>
        </button>
        <button mat-button [matMenuTriggerFor]="userMenu" aria-label="Menu użytkownika" class="user-button-mobile">
            <mat-icon class="user-icon">account_circle</mat-icon>
        </button>
        <mat-menu class="user-menu" #userMenu="matMenu">
            <span class="email" mat-menu-item>{{ username }}</span>
            <mat-divider></mat-divider>
            <button class="user-logout-mobile" mat-menu-item (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Wyloguj</span>
            </button>
        </mat-menu>
    </nav>
</header>
<router-outlet></router-outlet>
